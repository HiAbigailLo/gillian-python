source: free_coding_q12.py
license: MIT
locale: en-US
id: free_coding_q12
title: Arithmetic expression (division) evaluated inside if condition
description: 'Practice: Arithmetic expression (division) evaluated inside if condition; float comparison.'
authors:
- first: Abigail
  last: Lo
  email: alo3@cmu.edu
  affiliation: Carnegie Mellon University
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
  - basic-syntax
  topics:
  - arithmetic-expression-division-evaluated-inside-if-condition
  - float-comparison
runtime:
  language: python
  version: 3
statement: |
  Write Python code that sets p to 15 and q to 4. If p divided by q is greater than 3, assign label the value 'High'. Otherwise, assign label the value 'Low'. Print label.
elements:
- type: editable
  location:
    snippet: |-
      p = 15
      q = 4
      if p / q > 3:
          label = 'High'
      else:
          label = 'Low'
      print(label)
  placeholder: |-
    # 1. Set p to 15 and q to 4.
    # 2. If p divided by q is greater than 3, assign label the value 'High'.
    # 3. Otherwise, assign label the value 'Low'.
    # 4. Print label.
testcases:
- title: Expected Output
  visible: true
  stdin: []
  stdout: |-
    High
  console: |-
    High
  status: pass
  feedback:
    on_pass:
    - Correct! p / q = 15 / 4 = 3.75. Since 3.75 > 3 is True, label is set to 'High'.
    on_fail:
    - Your output doesn't match. Re-read the steps and trace each value.

