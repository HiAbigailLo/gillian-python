$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: free_coding_q13.py
license: MIT
locale: en-US
id: free_coding_q13
title: Single variable updated inside if/else branch
description: 'Practice: Single variable updated inside if/else branch; must determine which branch executes.'
authors:
- first: Abigail
  last: Lo
  email: alo3@cmu.edu
  affiliation: Carnegie Mellon University
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
  - basic-syntax
  topics:
  - single-variable-updated-inside-if-else-branch
  - must-determine-which-branch-executes
runtime:
  language: python
  version: 3
statement: |
  Write Python code that sets score to 45. If score is greater than or equal to 50, add 10 to score and store it back. Otherwise, subtract 5 from score and store it back. Print the final value of score.
elements:
- type: editable
  location:
    snippet: |-
      score = 45
      if score >= 50:
          score = score + 10
      else:
          score = score - 5
      print(score)
  placeholder: |-
    # 1. Set score to 45.
    # 2. If score is greater than or equal to 50, add 10 to score and store it back.
    # 3. Otherwise, subtract 5 from score and store it back.
    # 4. Print the final value of score.
testcases:
- title: Expected Output
  visible: true
  stdin: []
  stdout: |-
    40
  console: |-
    40
  status: pass
  feedback:
    on_pass:
    - 'Correct! 45 >= 50 is False, so the else-branch runs: score = 45 - 5 = 40.'
    on_fail:
    - Your output doesn't match. Re-read the steps and trace each value.

