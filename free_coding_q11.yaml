license: MIT
locale: en-US
id: free_coding_q11
title: Arithmetic expression (multiplication) evaluated inside if condition
description: 'Practice: Arithmetic expression (multiplication) evaluated inside if condition.'
authors:
- first: Abigail
  last: Lo
  email: alo3@cmu.edu
  affiliation: Carnegie Mellon University
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
  - basic-syntax
  topics:
  - arithmetic-expression-multiplication-evaluated-inside-if-condition
runtime:
  language: python
  version: 3
statement: |
  Write Python code that sets a to 4 and b to 6. If a multiplied by b is greater than or equal to 25, print 'Big'. Otherwise, print 'Small'.
elements:
- type: editable
  location:
    snippet: |-
      a = 4
      b = 6
      if a * b >= 25:
          print('Big')
      else:
          print('Small')
  placeholder: |-
    # 1. Set a to 4 and b to 6.
    # 2. If a multiplied by b is greater than or equal to 25, print 'Big'.
    # 3. Otherwise, print 'Small'.
testcases:
- title: Expected Output
  visible: true
  stdin: []
  stdout: |-
    Small
  console: |-
    Small
  status: pass
  feedback:
    on_pass:
    - Correct! a * b = 4 * 6 = 24. Since 24 >= 25 is False, the else-branch runs and 'Small' is printed.
    on_fail:
    - Your output doesn't match. Re-read the steps and trace each value.

