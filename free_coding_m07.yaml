$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: free_coding_m07.py
license: MIT
locale: en-US
id: free_coding_m07
title: Arithmetic on both sides of a comparison
description: 'Practice: Arithmetic on both sides of a comparison; strict > at equality.'
authors:
- first: Abigail
  last: Lo
  email: alo3@cmu.edu
  affiliation: Carnegie Mellon University
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
  - basic-syntax
  topics:
  - arithmetic-on-both-sides-of-a-comparison
  - strict-at-equality
runtime:
  language: python
  version: 3
statement: |
  Write Python code that sets x to 10 and y to 4. If x minus y is greater than y plus 2, print 'Left'. Otherwise, print 'Right'.
elements:
- type: editable
  location:
    snippet: |-
      x = 10
      y = 4
      if x - y > y + 2:
          print('Left')
      else:
          print('Right')
  placeholder: |-
    # 1. Set x to 10 and y to 4.
    # 2. If x minus y is greater than y plus 2, print 'Left'.
    # 3. Otherwise, print 'Right'.
testcases:
- title: Expected Output
  visible: true
  stdin: []
  stdout: |-
    Right
  console: |-
    Right
  status: pass
  feedback:
    on_pass:
    - 'Correct! Left side: x - y = 6. Right side: y + 2 = 6. The comparison 6 > 6 is False (equal is not
      greater), so ''Right'' is printed.'
    on_fail:
    - Your output doesn't match. Re-read the steps and trace each value.
