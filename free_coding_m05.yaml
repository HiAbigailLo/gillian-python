$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: free_coding_m05.py
license: MIT
locale: en-US
id: free_coding_m05
title: Multiplication in an if/elif/else chain
description: 'Practice: Multiplication in an if/elif/else chain; top-down evaluation of conditions.'
authors:
- first: Abigail
  last: Lo
  email: alo3@cmu.edu
  affiliation: Carnegie Mellon University
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
  - basic-syntax
  topics:
  - multiplication-in-an-if-elif-else-chain
  - top-down-evaluation-of-conditions
runtime:
  language: python
  version: 3
statement: |
  Write Python code that sets a to 6 and b to 4. If a multiplied by b is greater than 30, print 'Large'. Else if a multiplied by b is greater than 20, print 'Medium'. Otherwise, print 'Small'.
elements:
- type: editable
  location:
    snippet: |-
      a = 6
      b = 4
      if a * b > 30:
          print('Large')
      elif a * b > 20:
          print('Medium')
      else:
          print('Small')
  placeholder: |-
    # 1. Set a to 6 and b to 4.
    # 2. If a multiplied by b is greater than 30, print 'Large'.
    # 3. Else if a multiplied by b is greater than 20, print 'Medium'.
    # 4. Otherwise, print 'Small'.
testcases:
- title: Expected Output
  visible: true
  stdin: []
  stdout: |-
    Medium
  console: |-
    Medium
  status: pass
  feedback:
    on_pass:
    - 'Correct! a * b is 24. The first check 24 > 30 is False, so Python moves to the elif: 24 > 20 is
      True, so it prints ''Medium'' and skips the else. Only one branch of an if/elif/else chain ever
      runs.'
    on_fail:
    - Your output doesn't match. Re-read the steps and trace each value.